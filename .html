const cardsContainer = document.getElementById('cards');
const searchInput = document.getElementById('search');
const searchBtn = document.getElementById('search-btn');
const clearBtn = document.getElementById('clear');
const resultsInfo = document.getElementById('results-info');
const countSpan = document.getElementById('count');
const searchForm = document.getElementById('searchForm');

function renderBooks(filteredBooks) {
  cardsContainer.innerHTML = "";
 
  if (filteredBooks.length === 0) {
    cardsContainer.innerHTML = '<div class="no-results">🔍 لا توجد نتائج مطابقة للبحث<br><small>جرب كلمات أخرى من العنوان أو المؤلف أو التصنيف أو الموضوع</small></div>';
    resultsInfo.style.display = 'none';
    return;
  }
 
  filteredBooks.forEach(book => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="marc-field">
        <span class="marc-label">[245 10]</span>
        <div class="marc-content">${book.title}</div>
      </div>
      <div class="marc-field">
        <span class="marc-label">[100 1#]</span>
        <div class="marc-content">${book.author}</div>
      </div>
      <div class="marc-field">
        <span class="marc-label">[082 04]</span>
        <div class="marc-content">${book.dewey}</div>
      </div>
      <div class="marc-field">
        <span class="marc-label">[520 ##]</span>
        <div class="marc-content">${book.reason}</div>
      </div>
      <div class="marc-field">
        <span class="marc-label">[650 #0]</span>
        <div class="marc-content">${book.topic}</div>
      </div>
    `;
    cardsContainer.appendChild(card);
  });
 
  countSpan.textContent = filteredBooks.length;
  resultsInfo.style.display = 'block';
}

function searchBooks(query) {
  if (!query.trim()) return books;
  const q = query.toLowerCase().trim();
  return books.filter(book =>
    book.title.toLowerCase().includes(q) ||
    book.author.toLowerCase().includes(q) ||
    book.dewey.includes(q) ||
    book.reason.toLowerCase().includes(q) ||
    book.topic.toLowerCase().includes(q)
  );
}

function performSearch() {
  const query = searchInput.value;
  const filtered = searchBooks(query);
  renderBooks(filtered);
}

searchForm.addEventListener('submit', (e) => {
  e.preventDefault();
  performSearch();
});
